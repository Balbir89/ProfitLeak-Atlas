name: ProfitLeak Atlas Python and SQL CI
on:
  push:
  pull_request:
jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fresh synthetic scenario (smaller CI dataset)
        run: python src/rebuild.py --rows 25000 --seed 20261115
      - name: Run complete logic test suite
        run: python -m unittest discover -s tests -v
